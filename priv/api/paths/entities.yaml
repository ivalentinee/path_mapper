post:
  summary: Add or replace an entity
  description: >-
    Declares one piece a session is made of: a map, a token, a wallpaper or a
    character. An id the server already holds is replaced, which is ordinary
    rather than exceptional - ids are unique everywhere, so a token sent again by
    a second package is the same token declared again.

    Replacing a map re-declares the surface built on it: what was placed and drawn
    there stays, and the new declaration's geometry takes effect. That is how a
    map re-exported from an editor reaches the table.

    Refused when the id currently holds a different kind. That is not sharing, it
    is an authoring mistake, and the server has no other way to notice it.

    A piece naming a piece the server does not hold is accepted. The reference
    resolves when it is read, so pieces may be sent in any order, and one that
    names something absent renders as naming something absent rather than
    failing.

    This is how everything reaches the server. There is no route that takes a
    package whole: an adventure is a sequence of these, and so is a group, and so
    is restoring a snapshot.
  tags: ['Session']
  requestBody:
    required: true
    content:
      'application/json':
        schema: { $ref: '../schemas/session/entity.yaml#/entity' }
  responses:
    '200':
      description: >-
        The piece is in the store.
      content:
        'application/json':
          schema: { $ref: '../schemas/common/ok.yaml#/acknowledgement' }
    '400':
      description: Unknown kind, invalid payload, or an id that holds another kind
      content:
        'application/json':
          schema: { $ref: '../schemas/common/error.yaml#/error' }
    '401':
      description: The upload token was missing or wrong
      content:
        'application/json':
          schema: { $ref: '../schemas/common/error.yaml#/error' }
get:
  summary: Hand over the entity store
  description: >-
    Returns everything the session is made of, which is what a client needs to
    build a snapshot: the entities, plus the assets they name, are the whole of it.
  tags: ['Session']
  responses:
    '200':
      description: The store
      content:
        'application/json':
          schema: { $ref: '../schemas/session/entity.yaml#/entityList' }
    '401':
      description: The upload token was missing or wrong
      content:
        'application/json':
          schema: { $ref: '../schemas/common/error.yaml#/error' }
