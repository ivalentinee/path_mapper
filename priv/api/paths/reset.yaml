post:
  summary: Put the server back to holding nothing
  description: >-
    Drops every piece the session holds, every bit of game state, and every
    stored asset. Nothing survives it, which is the point: it is one of the two
    moments that bound what the server holds, the other being a restart.

    This is how a game master starts a different game. It is deliberately not
    reachable from the browser - an unauthenticated console must not carry a
    control that ends a session.
  tags: ['Session']
  responses:
    '200':
      description: The server now holds nothing
      content:
        'application/json':
          schema: { $ref: '../schemas/common/ok.yaml#/acknowledgement' }
    '401':
      description: The upload token was missing or wrong
      content:
        'application/json':
          schema: { $ref: '../schemas/common/error.yaml#/error' }
