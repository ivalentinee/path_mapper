version: "3"

services:
  web:
    build:
      context: .
      target: dev
    image: path_mapper/web
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
    environment:
      MIX_ENV: null
      API_TOKEN: dev-api-token
    user: '1000:1000'

  build:
    build:
      context: .
      target: dev
      args:
        BUILD_IMAGE: hexpm/elixir:1.19.5-erlang-26.0.2-ubuntu-noble-20260324
    image: path_mapper/build
    volumes:
      - ./:/app
    environment:
      MIX_ENV: prod
    user: '1000:1000'
